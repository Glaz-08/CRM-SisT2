services:
  api:
    build:
      context: ./backend
    container_name: crm-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"

  web:
    build:
      context: ./frontend
    container_name: crm-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

